<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}Mi Tienda{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
      rel="stylesheet">
      {% load static %}
      <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
    <style>
      body {
        background-color: #f8f9fa;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      main {
        flex-grow: 1;
        padding: 2rem 0;
      }
      footer {
        background-color: #212529;
        color: #ccc;
        text-align: center;
        padding: 1rem 0;
        margin-top: auto;
      }
      .navbar-brand {
        font-weight: bold;
        letter-spacing: 1px;
      }
    </style>
  </head>

  <body>
    <!-- Header / Navbar -->
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
          <a class="navbar-brand" href="/">🛒 eCommerce</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav ms-auto">
              <a class="nav-link" href="{% url 'cliente' %}">Clientes</a>
              <a class="nav-link" href="{% url 'tipodoc' %}">Tipo de Documento</a>
              <a class="nav-link" href="{% url 'producto' %}">Productos</a>
              <a class="nav-link" href="{% url 'pedido' %}">Pedidos</a>
              <a class="nav-link" href="{% url 'categoria' %}">Categorías</a>
              <a class="nav-link" href="{% url 'buscar' %}">Buscar</a>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <!-- Contenido principal -->
    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer>
      <p class="mb-0">&copy; {{ now|date:"Y" }} Mi Tienda - Todos los derechos reservados.</p>
      <small class="text-secondary">👀 Visitantes totales: {{ contador_visitas }}</small>
      
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
